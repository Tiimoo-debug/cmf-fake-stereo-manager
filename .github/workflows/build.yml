name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version code is derived from the commit count.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          mkdir -p out
          VER=$(grep -m1 versionName app/build/outputs/apk/release/output-metadata.json \
                | cut -d'"' -f4 || echo unknown)
          cp app/build/outputs/apk/release/app-release.apk \
             "out/cmf-stereo-manager-v${VER}-$(git rev-parse --short HEAD).apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      # Actions artifacts need a login to download and expire after 90 days.
      # A rolling prerelease gives every main build a permanent, public URL.
      - name: Publish rolling build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Automatic build of `main`. Debug-signed, for sideloading.

            Needs the [cmf-fake-stereo](https://github.com/Tiimoo-debug/cmf-fake-stereo)
            module installed. Tagged releases are the stable ones; this tag
            moves with every push.
          files: out/*.apk
