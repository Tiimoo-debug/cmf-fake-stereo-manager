name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version code is derived from the commit count.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          mkdir -p out
          VER=$(grep -m1 versionName app/build/outputs/apk/release/output-metadata.json \
                | cut -d'"' -f4 || echo unknown)
          cp app/build/outputs/apk/release/app-release.apk \
             "out/cmf-stereo-manager-v${VER}-$(git rev-parse --short HEAD).apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
